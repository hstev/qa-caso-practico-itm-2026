name: Reporte de defecto
description: Registrar un defecto encontrado durante las pruebas (Caso Práctico ITM 2026)
title: "[DEF-XX] "
labels: ["defecto", "estado:nuevo"]
body:
  - type: input
    id: caso
    attributes: { label: Caso de prueba asociado, placeholder: "CP-07 / TA-10" }
    validations: { required: true }
  - type: dropdown
    id: severidad
    attributes: { label: Severidad, options: [Crítico, Alto, Medio, Bajo] }
    validations: { required: true }
  - type: dropdown
    id: prioridad
    attributes: { label: Prioridad, options: [P1 - Inmediata, P2 - Alta, P3 - Media, P4 - Baja] }
    validations: { required: true }
  - type: input
    id: componente
    attributes: { label: Componente / endpoint }
  - type: textarea
    id: pasos
    attributes: { label: Pasos para reproducir }
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes: { label: Resultado esperado }
    validations: { required: true }
  - type: textarea
    id: obtenido
    attributes: { label: Resultado obtenido }
    validations: { required: true }
  - type: textarea
    id: evidencia
    attributes: { label: Evidencia (capturas, logs, reportes) }
